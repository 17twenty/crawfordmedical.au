<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crawford Medical</title>
<meta name="description" content="Crawford Medical - Bringing health to the Riverina">
<link rel="canonical" href="https://www.crawfordmedical.au/">
<meta name="theme-color" content="#E3E5DE">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">

<meta property="og:type" content="website">
<meta property="og:url" content="https://www.crawfordmedical.au/">
<meta property="og:title" content="Crawford Medical">
<meta property="og:description" content="Crawford Medical - Bringing health to the Riverina">
<meta property="og:locale" content="en_AU">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,300;7..72,400;7..72,500&display=swap" rel="stylesheet">

<style>
  :root {
    --paper:  #E3E5DE;
    --ink:    #202722;
    --muted:  #545F55;
    --river:  #5F7359;

    --gutter: clamp(1.5rem, 6vw, 7rem);
    --serif:  "Literata", Georgia, "Times New Roman", serif;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--serif);
    font-size: clamp(1rem, 0.96rem + 0.2vw, 1.0625rem);
    font-weight: 400;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .page {
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
  }

  /* The empty half of the page. It is meant to be empty: there is
     not much here yet, and the layout says so before the words do. */
  .sky {
    flex: 1 1 auto;
    min-height: 4rem;
  }

  .river {
    display: block;
    width: 100%;
    height: clamp(52px, 9vh, 104px);
    flex: 0 0 auto;
  }

  .river path {
    fill: none;
    stroke: var(--river);
    stroke-width: 2;
    stroke-linecap: round;
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
    animation: draw 2.6s cubic-bezier(0.33, 0.7, 0.3, 1) 0.2s forwards;
  }

  @keyframes draw { to { stroke-dashoffset: 0; } }

  .ground {
    flex: 0 0 auto;
    padding: clamp(1.75rem, 4vh, 3.25rem) var(--gutter) 0;
  }

  .name {
    margin: 0;
    font-size: clamp(2rem, 9vw, 6.25rem);
    font-weight: 300;
    line-height: 1.02;
    letter-spacing: -0.022em;
  }

  .lede {
    margin: clamp(1.25rem, 3vh, 2rem) 0 0;
    max-width: min(44ch, 100%);
    font-weight: 300;
    font-size: clamp(1.0625rem, 1rem + 0.45vw, 1.3125rem);
    line-height: 1.62;
  }

  .reach {
    margin: 1.15rem 0 0;
    max-width: min(40ch, 100%);
    color: var(--muted);
  }

  .email {
    display: inline-block;
    margin-top: clamp(1.5rem, 4vh, 2.5rem);
    font-size: clamp(1.0625rem, 1rem + 0.35vw, 1.25rem);
    font-weight: 500;
    color: var(--ink);
    text-decoration: underline;
    text-decoration-color: var(--river);
    text-decoration-thickness: 1px;
    text-underline-offset: 0.32em;
  }

  .email:hover,
  .email:focus-visible {
    color: var(--river);
    text-decoration-thickness: 2px;
  }

  .email:focus-visible {
    outline: 2px solid var(--river);
    outline-offset: 6px;
    text-decoration-color: transparent;
  }

  .place {
    flex: 0 0 auto;
    padding: clamp(2.5rem, 8vh, 5rem) var(--gutter) clamp(1.75rem, 4vh, 2.75rem);
    margin: 0;
    color: var(--muted);
    font-size: 0.9375rem;
  }

  @media (prefers-reduced-motion: reduce) {
    .river path { animation: none; stroke-dashoffset: 0; }
  }
</style>
</head>
<body>

<main class="page">
  <div class="sky" aria-hidden="true"></div>

  <svg class="river" viewBox="0 0 1440 120" preserveAspectRatio="none" role="presentation" focusable="false">
    <path pathLength="1"
          d="M0,72 C120,72 180,30 300,32 C420,34 470,88 600,90 C730,92 790,38 920,36 C1050,34 1102,80 1232,82 C1332,83.5 1384,62 1440,54"/>
  </svg>

  <div class="ground">
    <h1 class="name">Crawford Medical</h1>

    <p class="lede">Welcome to Crawford Medical - based in the Riverina.</p>

    <p class="reach">There is not much here yet. Email is the best way to get in touch.</p>

    <a class="email" href="mailto:kate@crawfordmedical.au">inquiries@crawfordmedical.au</a>
  </div>

  <p class="place">Wagga Wagga, New South Wales.</p>
</main>

</body>
</html>
